# Cloud Build pipeline — build the scorecard vision agent, push to Artifact
# Registry, and deploy to Cloud Run (`wgp-scorecard`).
#
# Run:
#   gcloud builds submit --config deploy/gcp/cloudbuild-scorecard.yaml \
#     --substitutions=SHORT_SHA=$(git rev-parse --short HEAD) .
# Or via GitHub Actions "Deploy to GCP" (deploy_scorecard / scorecard-agent/** push).

substitutions:
  _REGION: us-central1
  _AR_REPO: wolf-goat-pig
  _SERVICE: wgp-scorecard
  _RUNTIME_SA_NAME: wgp-run
  _SECRETS: "SCORECARD_SERVICE_SECRET=BOOKING_SERVICE_SECRET:latest"
  _VISION_MODEL: gemini-2.5-flash

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - scorecard-agent/Dockerfile
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest"
      - scorecard-agent

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}"

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}
      - --service-account=${_RUNTIME_SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      - --cpu=2
      - --memory=2Gi
      - --timeout=300
      - --concurrency=4
      - --port=8080
      - --set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},GCP_LOCATION=global,SCORECARD_VISION_MODEL=${_VISION_MODEL}
      - --set-secrets=${_SECRETS}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
