# Non-secret environment for the Cloud Run service (Phase 1).
# Secret values are injected separately from Secret Manager via --set-secrets
# (see the deploy workflow and secrets.md) and must NOT appear here.
#
# Applied with:  gcloud run deploy ... --env-vars-file=env.production.yaml
#
# ⚠️  Two URL-dependent values (BACKEND_URL, and the frontend's VITE_API_URL) are
#     only known after the first deploy prints the Cloud Run URL. Fill BACKEND_URL
#     in, then redeploy. Until then the app still boots; only self-referential
#     links are affected.

ENVIRONMENT: "production"

# Auth0 stays (design doc D4). The audience is a stable API identifier; despite
# its hostname-shaped value, it is not a live Render endpoint.
AUTH0_DOMAIN: "dev-jm88n088hpt7oe48.us.auth0.com"
AUTH0_API_AUDIENCE: "https://wolf-goat-pig.onrender.com"
AUTH0_CLIENT_ID: "qAZuRv5E9mPQ9uTGg7NWpkpfVj8bCeoB"
SUPER_ADMIN_EMAILS: "stuagano@gmail.com,greenjs@gmail.com"

# Front/back URLs. FRONTEND_URL drives CORS; BACKEND_URL is the Cloud Run service.
FRONTEND_URL: "https://wolfgoatpig.com"
BACKEND_URL: "https://wolf-goat-pig-api-i5v2shrpoa-uc.a.run.app"

# GHIN integration (static token is public by design; user/pass are secrets).
ENABLE_GHIN_INTEGRATION: "true"
GHIN_API_STATIC_TOKEN: "ghincom"

# Legacy tee-sheet integration stays DISCONNECTED by default (#313). While this
# is unset/false the whole /tee-sheet router returns 503, so even though
# ENVIRONMENT=production would otherwise enable live writes (#323), no live
# mutation can occur. Set to "true" only when a live tee sheet is intended.
LEGACY_TEE_SHEET_ENABLED: "false"

# Legacy signup sync paused by user request (issue #319). App signups stay local.
LEGACY_SIGNUP_SYNC_ENABLED: "false"
LEGACY_SIGNUP_CREATE_URL: "https://thousand-cranes.com/WolfGoatPig/wgp_add_tee_sheet_ajax.cgi"
LEGACY_SIGNUP_FIELD_MAP: '{"player_name": "name", "date": "date"}'
LEGACY_SIGNUP_CREATE_ACTION_FIELD: "type"
LEGACY_SIGNUP_CREATE_ACTION_VALUE: "add"
LEGACY_SIGNUP_CANCEL_ACTION_FIELD: "type"
LEGACY_SIGNUP_CANCEL_ACTION_VALUE: "cancel"

# Email (Resend). Key is a secret.
EMAIL_PROVIDER: "resend"
FROM_EMAIL: "onboarding@resend.dev"
FROM_NAME: "Wolf Goat Pig"

# ForeTees booking agent (Computer Use on Cloud Run).
BOOKING_SERVICE_URL: "https://wgp-booking-i5v2shrpoa-uc.a.run.app"
FORETEES_ENABLED: "false"

# Scorecard vision agent (Vertex Gemini on Cloud Run).
SCORECARD_VISION_PROVIDER: "agent"
SCORECARD_SERVICE_URL: "https://wgp-scorecard-i5v2shrpoa-uc.a.run.app"

# Commissioner AI (Vertex Gemini in-process on the main API).
GCP_PROJECT_ID: "seventh-country-232522"
GCP_LOCATION: "global"
COMMISSIONER_LLM_PROVIDER: "vertex"
COMMISSIONER_MODEL: "gemini-2.5-flash"

# Server tuning. WEB_CONCURRENCY=1 matches Render; Cloud Run scales by instance,
# not by in-process workers, so keep a single uvicorn worker per instance.
WEB_CONCURRENCY: "1"
FORWARDED_ALLOW_IPS: "*"
TIMEOUT_KEEP_ALIVE: "75"
EXTERNAL_HEALTH_TTL: "300"

# Phase 4: disable the in-process `schedule` thread — Cloud Scheduler drives the
# periodic work via POST /internal/jobs/* instead (see phase4-scheduling/). Every
# autoscaled instance would otherwise run its own copy of every loop.
RUN_INPROCESS_SCHEDULERS: "false"

# Phase 2 (Cloud SQL): pool defaults match the Render free tier. Cloud SQL can
# afford more headroom — uncomment/raise once the DB is Cloud SQL.
# DB_POOL_SIZE: "10"
# DB_MAX_OVERFLOW: "20"


# Phase 5 — private GCS bucket for uploaded avatars (served via /players/{id}/avatar).
MEDIA_BUCKET: "wgp-media-seventh-country-232522"
