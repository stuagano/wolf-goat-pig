name: Pause Vercel project

# One-shot decommission helper. Uses repo secret VERCEL_TOKEN.
# Project: wolf-goat-pig (prj_CJzsHBaQQ00DJxxY7YccoNKjfMCr)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "pause or unpause"
        type: choice
        options: [pause, unpause]
        default: pause

permissions:
  contents: read

jobs:
  vercel:
    runs-on: ubuntu-latest
    steps:
      - name: ${{ inputs.action }} Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_CJzsHBaQQ00DJxxY7YccoNKjfMCr
          TEAM_ID: team_TyqnuwqOYuRgUf1AXH6JvJsr
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN}" ]]; then
            echo "VERCEL_TOKEN secret is empty" >&2
            exit 1
          fi
          code="$(curl -sS -o /tmp/vercel-out.json -w '%{http_code}' -X POST \
            "https://api.vercel.com/v1/projects/${PROJECT_ID}/${ACTION}?teamId=${TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json")"
          echo "HTTP ${code}"
          cat /tmp/vercel-out.json || true
          echo
          case "${code}" in
            200|204) echo "${ACTION} succeeded" ;;
            *) echo "${ACTION} failed" >&2; exit 1 ;;
          esac

          # Confirm paused flag
          curl -sS "https://api.vercel.com/v9/projects/${PROJECT_ID}?teamId=${TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('name=',d.get('name')); print('paused=',d.get('paused'))"
