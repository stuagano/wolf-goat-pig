name: Disconnect Vercel

# One-shot. Removes the GitHub connection that posts the failing "Vercel" check,
# then deletes the decommissioned project. Uses repo secret VERCEL_TOKEN.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disconnect:
    runs-on: ubuntu-latest
    steps:
      - name: Disconnect GitHub and delete the paused project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_CJzsHBaQQ00DJxxY7YccoNKjfMCr
          TEAM_ID: team_TyqnuwqOYuRgUf1AXH6JvJsr
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${VERCEL_TOKEN}")
          base="https://api.vercel.com"
          team="teamId=${TEAM_ID}"

          echo "== project =="
          curl -fsS "${base}/v9/projects/${PROJECT_ID}?${team}" "${auth[@]}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('name', d.get('name')); print('paused', d.get('paused')); print('link', d.get('link'))"

          echo "== disconnect =="
          code=$(curl -sS -o /tmp/disconnect.json -w '%{http_code}' -X DELETE \
            "${base}/v9/projects/${PROJECT_ID}/link?${team}" "${auth[@]}")
          echo "disconnect HTTP ${code}"
          cat /tmp/disconnect.json; echo
          case "${code}" in 200|204|404) ;; *) exit 1 ;; esac

          echo "== delete project =="
          code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE \
            "${base}/v9/projects/${PROJECT_ID}?${team}" "${auth[@]}")
          echo "delete HTTP ${code}"
          cat /tmp/delete.json; echo
          case "${code}" in 200|204|404) ;; *) exit 1 ;; esac

          echo "== confirm gone =="
          code=$(curl -sS -o /tmp/gone.json -w '%{http_code}' \
            "${base}/v9/projects/${PROJECT_ID}?${team}" "${auth[@]}")
          echo "lookup HTTP ${code}"
          cat /tmp/gone.json; echo
          test "${code}" = "404"
