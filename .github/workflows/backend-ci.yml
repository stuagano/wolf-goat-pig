name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# Cancel superseded runs: a new push to the same PR/branch aborts the in-flight
# run instead of piling up redundant CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    # Disposable loopback databases only. Individual fixtures isolate schemas or
    # create their own *_test database; no production credentials are used.
    env:
      PGCLIENTENCODING: UTF8
      RUN_INPROCESS_SCHEDULERS: 'false'
      SCORE_SAVE_REQUIRE_POSTGRES: '1'
      SCORE_SAVE_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/round_identity_test
      ROUND_IDENTITY_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/round_identity_test
      ROUND_MIGRATION_PG15_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/round_identity_test
      ROUND_MIGRATION_PG17_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5433/round_identity_test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: round_identity_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      postgres17:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: round_identity_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-testing.txt
        pip install pytest-cov
    
    - name: Run Ruff linting and format check
      run: |
        cd backend
        # Pin ruff so the format gate is deterministic — a floating `pip install
        # ruff` lets any new release reformat code and break unrelated PRs.
        pip install -r requirements-testing.txt
        ruff check app/ tests/
        ruff format --check app/ tests/

    # Keep the committed OpenAPI contract honest on every backend change — do not
    # wait for the separate openapi-contract workflow. Fail here if routes/schemas
    # drifted without regenerating backend/openapi.json.
    - name: Check OpenAPI contract is in sync
      if: matrix.python-version == '3.12'
      run: |
        cd backend
        python scripts/export_openapi.py --check
    
    - name: Run type checking
      run: |
        cd backend
        pip install mypy types-requests
        mypy app/ --config-file=mypy.ini
      # Advisory only — 148 pre-existing mypy errors across the codebase need
      # a separate cleanup pass. Re-enable as a hard gate once that's done.
      continue-on-error: true
    
    - name: Verify disposable PostgreSQL fixture wiring
      run: |
        cd backend
        python - <<'PY'
        import os
        from sqlalchemy import create_engine, text
        from sqlalchemy.engine import make_url

        for name, major in (
            ("SCORE_SAVE_TEST_DATABASE_URL", 15),
            ("ROUND_IDENTITY_TEST_DATABASE_URL", 15),
            ("ROUND_MIGRATION_PG15_URL", 15),
            ("ROUND_MIGRATION_PG17_URL", 17),
        ):
            url = make_url(os.environ[name])
            assert url.host == "127.0.0.1" and url.database.endswith("round_identity_test")
            assert url.drivername == "postgresql+psycopg2" and not url.query
            engine = create_engine(url, connect_args={"connect_timeout": 5})
            with engine.connect() as connection:
                assert int(connection.scalar(text("SHOW server_version_num"))) // 10000 == major
                assert connection.scalar(text("SHOW client_encoding")) == "UTF8"
            engine.dispose()
            print(f"{name}: PostgreSQL {major}, UTF8, disposable loopback database verified")
        PY

    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/round_identity_test
        SECRET_KEY: test-secret-key-for-ci
        ENVIRONMENT: test
      run: |
        cd backend
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term --ignore=tests/manual --ignore=tests/_diagnostic
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
      if: matrix.python-version == '3.11'
    
    - name: Upload test artifacts
      uses: actions/upload-artifact@v7
      with:
        name: backend-test-results-${{ matrix.python-version }}
        path: |
          backend/htmlcov/
          backend/.coverage
      if: failure()

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        cd backend
        bandit -r app/ -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Check dependencies for vulnerabilities
      run: |
        cd backend
        safety check --json > safety-report.json
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v7
      with:
        name: security-reports
        path: |
          backend/bandit-report.json
          backend/safety-report.json

# Image build/deploy lives in deploy-gcp.yml via Cloud Build and Artifact Registry.