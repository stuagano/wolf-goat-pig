name: Daily GHIN Handicap Sync

on:
  schedule:
    - cron: '0 14 * * *'  # 10am ET daily
  workflow_dispatch:       # Allow manual trigger

# Don't let a slow run overlap the next scheduled fire; never cancel one that's
# already talking to the backend.
concurrency:
  group: ghin-sync
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/_cron-curl.yml
    with:
      label: GHIN sync
      # Cloud Scheduler also fires /internal/jobs/ghin-sync at 06:00 UTC.
      # This GHA pass is the ~10am ET catch-up (idempotent).
      url: https://wolf-goat-pig-api-i5v2shrpoa-uc.a.run.app/ghin/sync-handicaps
      headers: 'Content-Type: application/json'
      max-time: 60
