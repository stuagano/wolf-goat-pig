name: Deploy to GCP

# Deploys:
#   - FastAPI backend → Cloud Run (cloudbuild.yaml)
#   - React SPA → Firebase Hosting
#   - Computer Use booking agent → Cloud Run (cloudbuild-booking.yaml)
# Auth: Workload Identity Federation (no SA JSON key).
#
# Triggers:
#   - workflow_dispatch — always available (manual button), never surprises.
#   - push to main      — deploys matching targets when paths change AND
#                         GCP_AUTO_DEPLOY == "true".
#
# Prerequisites (one-time, see deploy/gcp/README.md):
#   - Run deploy/gcp/phase0-foundation/*.sh  (incl. 25-cloud-build-iam.sh)
#   - Set repo Actions *Variables*: GCP_PROJECT_ID, GCP_REGION,
#     GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SA
#     (opt-in auto-deploy) GCP_AUTO_DEPLOY=true
#     (Phase 3) VITE_API_URL; optional FIREBASE_SITE

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Build + deploy the FastAPI backend to Cloud Run (Phase 1)"
        type: boolean
        default: true
      deploy_frontend:
        description: "Build + deploy the React SPA to Firebase Hosting (Phase 3)"
        type: boolean
        default: false
      deploy_booking:
        description: "Build + deploy the Computer Use booking agent (Phase 7)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "booking-agent/**"
      - "deploy/gcp/**"
      - ".github/workflows/deploy-gcp.yml"

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

env:
  RUN_SERVICE: wolf-goat-pig-api
  BOOKING_SERVICE: wgp-booking

jobs:
  # Path filter so each target only rebuilds when its sources change.
  # Skipped on workflow_dispatch (manual checkboxes decide).
  changes:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      booking: ${{ steps.filter.outputs.booking }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/gcp/cloudbuild.yaml'
              - 'deploy/gcp/phase0-foundation/**'
              - 'deploy/gcp/phase1-cloud-run/**'
              - 'deploy/gcp/phase2-cloud-sql/**'
              - 'deploy/gcp/phase4-scheduling/**'
              - 'deploy/gcp/phase5-storage/**'
              - '.github/workflows/deploy-gcp.yml'
            frontend:
              - 'frontend/**'
              - 'deploy/gcp/phase3-hosting/**'
              - '.github/workflows/deploy-gcp.yml'
            booking:
              - 'booking-agent/**'
              - 'deploy/gcp/cloudbuild-booking.yaml'
              - 'deploy/gcp/phase7-booking/**'
              - '.github/workflows/deploy-gcp.yml'

  deploy-backend:
    needs: [changes]
    # `always()` so a skipped `changes` job (manual run) does not cancel this job.
    if: >-
      ${{ always() &&
          (needs.changes.result == 'success' || needs.changes.result == 'skipped') &&
          ((github.event_name == 'workflow_dispatch' && inputs.deploy_backend) ||
           (github.event_name == 'push' && vars.GCP_AUTO_DEPLOY == 'true' &&
            needs.changes.outputs.backend == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP (keyless, WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & deploy via Cloud Build
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION }}"
          BUILD_ID="$(
            gcloud builds submit \
              --async \
              --project="${PROJECT}" \
              --region="${REGION}" \
              --config=deploy/gcp/cloudbuild.yaml \
              --substitutions="SHORT_SHA=${GITHUB_SHA::12},_REGION=${REGION}" \
              --format='value(id)' \
              .
          )"
          echo "Cloud Build id: ${BUILD_ID}"
          # Async submit avoids the 60 polls/min quota on synchronous gcloud builds submit.
          for attempt in $(seq 1 60); do
            STATUS="$(
              gcloud builds describe "${BUILD_ID}" \
                --project="${PROJECT}" \
                --region="${REGION}" \
                --format='value(status)'
            )"
            echo "[$attempt] build status=${STATUS}"
            case "${STATUS}" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED)
                gcloud builds log "${BUILD_ID}" --project="${PROJECT}" --region="${REGION}" | tail -80
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for Cloud Build ${BUILD_ID}"
          exit 1

      - name: Smoke test /ready and /players/me auth
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${RUN_SERVICE}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --format='value(status.url)')"
          echo "Service URL: ${URL}"
          ready_code="$(curl -s -o /dev/null -w '%{http_code}' "${URL}/ready")"
          echo "GET /ready -> ${ready_code}"
          test "${ready_code}" = "200"
          auth_code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer junk' "${URL}/players/me")"
          echo "GET /players/me (junk token) -> ${auth_code}"
          test "${auth_code}" = "401"

  deploy-frontend:
    needs: [changes]
    if: >-
      ${{ always() &&
          (needs.changes.result == 'success' || needs.changes.result == 'skipped') &&
          ((github.event_name == 'workflow_dispatch' && inputs.deploy_frontend) ||
           (github.event_name == 'push' && vars.GCP_AUTO_DEPLOY == 'true' &&
            needs.changes.outputs.frontend == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Stay on Node 20 LTS — Node 22 + npm 10 has flaked with
          # "Exit handler never called!" during npm install on this repo.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build SPA
        working-directory: frontend
        env:
          # Cross-origin to Cloud Run; backend CORS honors FRONTEND_URL.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AUTH0_DOMAIN: "dev-jm88n088hpt7oe48.us.auth0.com"
          VITE_AUTH0_CLIENT_ID: "qAZuRv5E9mPQ9uTGg7NWpkpfVj8bCeoB"
          # Stable Auth0 API identifier; this is not a live Render endpoint.
          VITE_AUTH0_AUDIENCE: "https://wolf-goat-pig.onrender.com"
          VITE_DEPLOY_PLATFORM: "firebase"
          CI: "false"
        run: |
          # npm 10 on GHA has repeatedly aborted mid-install ("Exit handler never
          # called") leaving no vite binary. Pin npm 9 and verify the toolchain.
          npm install -g npm@9.9.4
          npm install --legacy-peer-deps --no-audit --no-fund
          test -x node_modules/.bin/vite
          npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Deploy to Firebase Hosting
        run: |
          set -euo pipefail
          # firebase.json resolves hosting.public relative to its own directory,
          # so run from repo root with the scaffolded config copied here.
          cp deploy/gcp/phase3-hosting/firebase.json ./firebase.json
          npm i -g firebase-tools
          firebase deploy --only hosting \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive

  deploy-booking:
    needs: [changes]
    if: >-
      ${{ always() &&
          (needs.changes.result == 'success' || needs.changes.result == 'skipped') &&
          ((github.event_name == 'workflow_dispatch' && inputs.deploy_booking) ||
           (github.event_name == 'push' && vars.GCP_AUTO_DEPLOY == 'true' &&
            needs.changes.outputs.booking == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP (keyless, WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & deploy booking agent via Cloud Build
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION }}"
          BUILD_ID="$(
            gcloud builds submit \
              --async \
              --project="${PROJECT}" \
              --region="${REGION}" \
              --config=deploy/gcp/cloudbuild-booking.yaml \
              --substitutions="SHORT_SHA=${GITHUB_SHA::12},_REGION=${REGION}" \
              --format='value(id)' \
              .
          )"
          echo "Cloud Build id: ${BUILD_ID}"
          for attempt in $(seq 1 60); do
            STATUS="$(
              gcloud builds describe "${BUILD_ID}" \
                --project="${PROJECT}" \
                --region="${REGION}" \
                --format='value(status)'
            )"
            echo "[$attempt] build status=${STATUS}"
            case "${STATUS}" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED)
                gcloud builds log "${BUILD_ID}" --project="${PROJECT}" --region="${REGION}" | tail -80
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for Cloud Build ${BUILD_ID}"
          exit 1

      - name: Smoke test /health
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${BOOKING_SERVICE}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --format='value(status.url)')"
          echo "Booking URL: ${URL}"
          code="$(curl -sS -o /tmp/booking-health.json -w '%{http_code}' "${URL}/health")"
          echo "GET /health -> ${code}"
          cat /tmp/booking-health.json
          test "${code}" = "200"
          grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/booking-health.json
