name: Deploy to GCP

# Deploys the FastAPI backend to Cloud Run via the Cloud Build pipeline
# (deploy/gcp/cloudbuild.yaml), authenticating keylessly through Workload
# Identity Federation — no service-account JSON key.
#
# Triggers:
#   - workflow_dispatch — always available (manual button), never surprises.
#   - push to main      — ONLY deploys the backend when the repo variable
#                         GCP_AUTO_DEPLOY == "true". Unset (the default) = the
#                         push run starts but the deploy job is skipped, so a
#                         merge can never surprise-deploy until you opt in.
# The frontend (Firebase Hosting) is manual-only regardless.
#
# Prerequisites (one-time, see deploy/gcp/README.md):
#   - Run deploy/gcp/phase0-foundation/*.sh  (incl. 25-cloud-build-iam.sh)
#   - Set repo Actions *Variables*: GCP_PROJECT_ID, GCP_REGION,
#     GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SA
#     (opt-in auto-deploy) GCP_AUTO_DEPLOY=true
#     (optional, Phase 3) FIREBASE_SITE, VITE_API_URL

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Build + deploy the FastAPI backend to Cloud Run (Phase 1)"
        type: boolean
        default: true
      deploy_frontend:
        description: "Build + deploy the React SPA to Firebase Hosting (Phase 3)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/gcp/**"
      - ".github/workflows/deploy-gcp.yml"

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

env:
  RUN_SERVICE: wolf-goat-pig-api

jobs:
  deploy-backend:
    # workflow_dispatch: honor the checkbox. push: only if opted in via the var.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_backend) ||
          (github.event_name == 'push' && vars.GCP_AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP (keyless, WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & deploy via Cloud Build
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION }}"
          BUILD_ID="$(
            gcloud builds submit \
              --async \
              --project="${PROJECT}" \
              --region="${REGION}" \
              --config=deploy/gcp/cloudbuild.yaml \
              --substitutions="SHORT_SHA=${GITHUB_SHA::12},_REGION=${REGION}" \
              --format='value(id)' \
              .
          )"
          echo "Cloud Build id: ${BUILD_ID}"
          # Async submit avoids the 60 polls/min quota on synchronous gcloud builds submit.
          for attempt in $(seq 1 60); do
            STATUS="$(
              gcloud builds describe "${BUILD_ID}" \
                --project="${PROJECT}" \
                --region="${REGION}" \
                --format='value(status)'
            )"
            echo "[$attempt] build status=${STATUS}"
            case "${STATUS}" in
              SUCCESS) exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED)
                gcloud builds log "${BUILD_ID}" --project="${PROJECT}" --region="${REGION}" | tail -80
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for Cloud Build ${BUILD_ID}"
          exit 1

      - name: Smoke test /ready and /players/me auth
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${RUN_SERVICE}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --format='value(status.url)')"
          echo "Service URL: ${URL}"
          ready_code="$(curl -s -o /dev/null -w '%{http_code}' "${URL}/ready")"
          echo "GET /ready -> ${ready_code}"
          test "${ready_code}" = "200"
          auth_code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer junk' "${URL}/players/me")"
          echo "GET /players/me (junk token) -> ${auth_code}"
          test "${auth_code}" = "401"

  deploy-frontend:
    # Manual-only — never runs on push, even with GCP_AUTO_DEPLOY set.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_frontend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build SPA
        working-directory: frontend
        env:
          # Cross-origin to Cloud Run (backend CORS honors FRONTEND_URL), mirroring
          # today's Vercel→Render setup. See phase3-hosting/README.md for the
          # same-origin /api rewrite alternative.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AUTH0_DOMAIN: "dev-jm88n088hpt7oe48.us.auth0.com"
          VITE_AUTH0_CLIENT_ID: "qAZuRv5E9mPQ9uTGg7NWpkpfVj8bCeoB"
          VITE_AUTH0_AUDIENCE: "https://wolf-goat-pig.onrender.com"
          VITE_DEPLOY_PLATFORM: "firebase"
          VITE_SENTRY_DSN: "https://aabb92ca227138a3deafbab2b4375bb3@o4511570300502016.ingest.us.sentry.io/4511570438586368"
          CI: "false"
        run: |
          # npm 10.x occasionally flakes on CI with "Exit handler never called" — retry once.
          npm ci --legacy-peer-deps --no-audit || npm ci --legacy-peer-deps --no-audit
          npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Deploy to Firebase Hosting
        run: |
          set -euo pipefail
          # firebase.json resolves hosting.public relative to its own directory,
          # so run from repo root with the scaffolded config copied here.
          cp deploy/gcp/phase3-hosting/firebase.json ./firebase.json
          npm i -g firebase-tools
          firebase deploy --only hosting \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive
